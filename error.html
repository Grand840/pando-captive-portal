<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANDO — Erreur</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="bg-glow"></div>

    <div class="portal">
        <div class="card">

            <!-- Warning Icon -->
            <svg class="icon-lg" viewBox="0 0 64 64" fill="none">
                <circle cx="32" cy="32" r="28" stroke="#F59E0B" stroke-width="2" opacity="0.2"/>
                <path d="M32 20v16" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
                <circle cx="32" cy="43" r="2" fill="#F59E0B"/>
            </svg>

            <h1 class="card-title">Une erreur est survenue</h1>

            <div class="alert alert-error">$(error)</div>

            <a href="$(link-login)" class="btn btn-primary" style="display:block;text-align:center;">
                Retour à la connexion
            </a>

            <div class="footer">
                PANDO — Un réseau. Une communauté.
            </div>

        </div>
    </div>

</body>
</html>
